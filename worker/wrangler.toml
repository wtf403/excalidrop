name = "excalidrop-auth"
main = "src/index.js"
compatibility_date = "2024-01-01"

# OAuth App client id (public). The secret goes via:
#   wrangler secret put GITHUB_CLIENT_SECRET
[vars]
GITHUB_CLIENT_ID = "REPLACE_WITH_OAUTH_APP_CLIENT_ID"
# Comma-separated canvas origins allowed to use this exchanger, e.g.:
# ALLOWED_REDIRECT_ORIGINS = "https://wtf403.github.io"
ALLOWED_REDIRECT_ORIGINS = ""
