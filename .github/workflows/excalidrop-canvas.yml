# Deploys the excalidrop canvas viewer to GitHub Pages — ONCE.
#
# Installed by `npx excalidrop setup` / `npx excalidrop publish` into the
# target repo's default branch. Trigger is manual ONLY (`workflow_dispatch`):
# scene autosync commits canvas.excalidraw to the `excalidrop` branch and the
# viewer reads it straight from the git blob at runtime, so saves must NEVER
# redeploy. Do NOT add `push`/`pull_request` triggers here.
name: Deploy excalidrop canvas

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canvas branch
        uses: actions/checkout@v4
        with:
          ref: excalidrop
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
