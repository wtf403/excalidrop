name: Deploy Excalidrop to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      public_read:
        description: 'Allow public read (writes always require GitHub login)'
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches: [main]
    paths: ['canvas.excalidraw', 'frontend/**', '.github/workflows/deploy-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
              - name: Seed scene to R2 (optional)
        env:
          CLOUDFLARER2TOKEN: ${{ secrets.CLOUDFLARER2TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/seed-r2.mjs || echo "R2 seed skipped (no credentials)"
              - run: npm run build:frontend
                env:
          VITE_API_URL: ${{ secrets.EXCALIDROP_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/frontend }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
