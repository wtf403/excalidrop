name: Deploy canvas viewers

# Auto-redeploy the viewer on canvas repos whenever the source changes.
# Scene files are never touched (publish preserves canvas.excalidraw), so
# this only ships new viewer builds — saves still never trigger deploys.
#
# Setup:
#   1. Create a token with Contents:read/write + Actions:read/write on every
#      target repo (fine-grained PAT, or classic PAT with repo+workflow).
#      GITHUB_TOKEN cannot push cross-repo, so it can't be used here.
#   2. gh secret set CANVAS_DEPLOY_TOKEN --repo wtf403/excalidrop --body <PAT>
#   3. Optional: gh variable set VIEWER_REPOS --repo wtf403/excalidrop \
#        --body "wtf403/excalidrop wtf403/excalidrop2"
# Without the secret the job skips green (forks without it stay quiet).

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/publish-pages.sh'
      - 'templates/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-viewers.yml'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space-separated owner/repo list (default: VIEWER_REPOS var)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-viewers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish viewer to canvas repos
        env:
          GH_TOKEN: ${{ secrets.CANVAS_DEPLOY_TOKEN }}
          CANVAS_DEPLOY_TOKEN: ${{ secrets.CANVAS_DEPLOY_TOKEN }}
          VIEWER_REPOS: ${{ vars.VIEWER_REPOS }}
          INPUT_REPOS: ${{ inputs.repos }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VIEWER_OAUTH_CLIENT_ID }}
          VITE_AUTH_EXCHANGE_URL: ${{ vars.AUTH_EXCHANGE_URL }}
        run: |
          if [ -z "$CANVAS_DEPLOY_TOKEN" ]; then
            echo "No CANVAS_DEPLOY_TOKEN secret — skipping viewer deploy."
            exit 0
          fi
          REPOS="${INPUT_REPOS:-$VIEWER_REPOS}"
          REPOS="${REPOS:-wtf403/excalidrop wtf403/excalidrop2}"
          for r in $REPOS; do
            echo "== $r =="
            REPO_SLUG="$r" bash scripts/publish-pages.sh
          done
