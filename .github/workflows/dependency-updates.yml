name: Dependency Updates

on:
  schedule:
    # Run every Monday at 3:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for outdated dependencies
        id: outdated
        run: |
          npm outdated --json > outdated.json || true
          if [ -s outdated.json ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Outdated dependencies found:"
            cat outdated.json
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "All dependencies are up to date!"
          fi

      - name: Update patch and minor versions
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          # Update patch versions (safe updates)
          npm update --save

          # Check if package.json or package-lock.json changed
          if git diff --quiet package.json package-lock.json; then
            echo "No updates applied"
            echo "updates_applied=false" >> $GITHUB_OUTPUT
          else
            echo "Updates applied"
            echo "updates_applied=true" >> $GITHUB_OUTPUT
          fi
        id: update

      - name: Run tests after update
        if: steps.update.outputs.updates_applied == 'true'
        run: |
          npm ci
          npm run type-check
          npm run build

      - name: Create Pull Request
        if: steps.update.outputs.updates_applied == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: 'chore(deps): automated dependency updates'
          body: |
            ## Automated Dependency Updates

            This PR updates patch and minor versions of dependencies.

            ### Changes
            - Updated dependencies to their latest compatible versions
            - All tests passed successfully
            - Type checking completed without errors

            ### Review Checklist
            - [ ] Review dependency changes
            - [ ] Check for breaking changes in changelogs
            - [ ] Verify build artifacts
            - [ ] Test locally if needed

            ---
            🤖 This PR was automatically created by the dependency update workflow.
          branch: chore/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated

  check-security-advisories:
    name: Check Security Advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        id: audit
        run: |
          npm audit --audit-level=high --json > audit.json || true

          VULNERABILITIES=$(cat audit.json | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical')

          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "count=$VULNERABILITIES" >> $GITHUB_OUTPUT
            echo "⚠️ Found $VULNERABILITIES high/critical vulnerabilities"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "✅ No high/critical vulnerabilities found"
          fi

      - name: Create security issue
        if: steps.audit.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));

            const vulnerabilities = audit.vulnerabilities || {};
            const vulnList = Object.entries(vulnerabilities)
              .filter(([_, v]) => v.severity === 'high' || v.severity === 'critical')
              .map(([name, v]) => `- **${name}** (${v.severity}): ${v.via[0].title || 'No title'}`)
              .join('\n');

            const issueBody = `## 🔒 Security Vulnerabilities Detected

            Found **${{ steps.audit.outputs.count }}** high/critical vulnerabilities in dependencies.

            ### Affected Packages
            ${vulnList}

            ### Action Required
            1. Review the vulnerabilities listed above
            2. Update affected packages: \`npm audit fix\`
            3. If automatic fix is not available, update manually
            4. Test thoroughly after updates

            ### Commands
            \`\`\`bash
            # Try automatic fix
            npm audit fix

            # For breaking changes
            npm audit fix --force

            # View detailed report
            npm audit
            \`\`\`

            ---
            🤖 This issue was automatically created by the security advisory check workflow.
            📅 Detected on: ${new Date().toISOString().split('T')[0]}
            `;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Security Vulnerabilities Detected')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Updated Security Scan\n\n${issueBody}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Security Vulnerabilities Detected',
                body: issueBody,
                labels: ['security', 'automated', 'high-priority']
              });
            }
